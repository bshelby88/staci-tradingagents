# fly.toml reconstructed 2026-09-18 from the LIVE machine config of
# staci-tradingagents (machines 829e15c70e0178 / 862452be7d4198, image
# deployment-01M0XY95FVX0P3EQ3C234Q5MZC) so a rebuild is byte-equivalent
# in routing, checks, sizing, and autoscaling.
# NOTE: no [env] block on purpose — X402_PAY_TO/X402_PRICE/RECEIPT_SECRET
# live as Fly secrets and survive this deploy untouched.

app = "staci-tradingagents"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
  memory_mb = 256
