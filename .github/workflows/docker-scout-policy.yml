# RAEN Fleet - Docker Scout Policy Gate
# Runs on every push to main - blocks merge if critical/high CVEs found
# Scans the already-pushed registry image (cloud driver cannot produce type=docker output).

name: Docker Scout Policy

on:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  DOCKER_USER: ${{ vars.DOCKER_USER || 'rogueshelby' }}
  SCOUT_IMAGE: ${{ vars.DOCKER_USER || 'rogueshelby' }}/${{ vars.DOCKER_IMAGE_NAME || github.event.repository.name }}:latest

jobs:
  scout-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Scout policy evaluate
        uses: docker/scout-action@481412c8b8de36d0f79e85aa382c60397466feb6
        with:
          command: cves
          image: ${{ env.SCOUT_IMAGE }}
          only-severities: critical,high
          exit-code: true
          summary: true
