# RAEN Fleet - Docker Build Cloud CI
# Integrates: Docker Build Cloud, Scout CVE scanning, less-privilege token, concurrency control
# Uses: rogueshelby/raen cloud builder, rogueshelby Docker Hub
# Supply-chain policy: every third-party action is pinned to its reviewed immutable SHA.

name: Build & Push (Docker Build Cloud)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: build-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: docker.io
  DOCKER_USER: ${{ vars.DOCKER_USER || 'rogueshelby' }}
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to Docker Hub
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx (cloud)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver: cloud
          endpoint: rogueshelby/raen

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

      # PR: build and cache only (no registry push)
      - name: Build (PR - cache only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=cacheonly

      # Push to main: build and push to registry
      - name: Build and push (main)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=registry,ref=${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Boot smoke (non-blocking advisory, mirrors Scout continue-on-error):
      # pull the pushed image and verify it boots. No /health route exists;
      # any HTTP response counts as "booted".
      - name: Boot smoke (non-blocking)
        if: github.event_name != 'pull_request' && github.event.pull_request.head.repo.fork != true
        continue-on-error: true
        run: |
          IMG="${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          echo "boot-smoke image: ${IMG}"
          docker pull "$IMG" || { echo "::warning::boot smoke: image pull failed"; exit 0; }
          docker run --rm -d -p 3000:3000 \
            -e PORT=3000 \
            -e X402_PAY_TO=0x7861db4efc14a1ed5dd8c96c528a3796560f1393 \
            --name boot-smoke "$IMG"
          trap 'docker rm -f boot-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:3000/ || true)
            echo "boot-smoke attempt $i: HTTP ${CODE:-no-response}"
            if [ -n "$CODE" ] && [ "$CODE" != "000" ]; then echo "::notice::boot smoke OK (HTTP $CODE — process booted)"; exit 0; fi
            sleep 2
          done
          echo "---- container logs (tail) ----"
          docker logs boot-smoke 2>&1 | tail -40 || true
          echo "::warning::boot smoke: no HTTP response within 30s"

      # Docker Scout: CVE scan every build (gate: critical/high)
      - name: Docker Scout CVEs
        if: github.event_name != 'pull_request' && github.event.pull_request.head.repo.fork != true
        uses: docker/scout-action@481412c8b8de36d0f79e85aa382c60397466feb6
        with:
          command: cves,quickview
          image: ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          only-severities: critical,high
          exit-code: true
          summary: true
          dockerhub-user: ${{ env.DOCKER_USER }}
          dockerhub-password: ${{ secrets.DOCKER_PAT }}
        continue-on-error: true   # advisory: base/npm CVEs w/o upstream fixes must not block publishes