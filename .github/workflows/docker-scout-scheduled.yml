# RAEN Fleet - Scheduled CVE Refresh
# Re-scans this repo's latest :tag every night and alerts on new vulnerabilities

name: Scout - Nightly CVE Refresh

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:       # manual trigger too

permissions:
  contents: read

jobs:
  scout-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Scout quickview
        uses: docker/scout-action@481412c8b8de36d0f79e85aa382c60397466feb6
        with:
          command: quickview
          image: ${{ vars.DOCKER_USER || 'rogueshelby' }}/${{ vars.DOCKER_IMAGE_NAME || github.event.repository.name }}:latest
          organization: ${{ vars.DOCKER_USER || 'rogueshelby' }}
